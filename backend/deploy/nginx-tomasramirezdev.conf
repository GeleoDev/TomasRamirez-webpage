# tomasramirezdev.com — sitio estático + panel/API (Node en 127.0.0.1:3100).
# Lo instala deploy/install.sh en /etc/nginx/sites-available/tomasramirezdev

limit_req_zone $binary_remote_addr zone=tr_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=tr_api:10m rate=10r/s;

upstream tr_panel { server 127.0.0.1:3100; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name tomasramirezdev.com www.tomasramirezdev.com;
    return 301 https://tomasramirezdev.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.tomasramirezdev.com;
    ssl_certificate /etc/letsencrypt/live/tomasramirezdev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tomasramirezdev.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://tomasramirezdev.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tomasramirezdev.com;
    ssl_certificate /etc/letsencrypt/live/tomasramirezdev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tomasramirezdev.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/tomasramirezdev;
    index index.html;
    client_max_body_size 12m;
    server_tokens off;

    include /etc/nginx/snippets/tomasramirezdev-common.conf;
}
