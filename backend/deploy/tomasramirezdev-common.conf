# Reglas compartidas (también las usa la prueba local).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

# Archivos internos que nunca deben verse
location ~ /\. { deny all; }

location / {
    try_files $uri $uri/ =404;
}

location ~* \.(webp|jpg|png|svg|mp4|js|css|woff2)$ {
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# Imágenes subidas desde el panel: solo WebP, nunca se ejecutan ni se interpretan.
location ^~ /uploads/ {
    alias /var/www/tomasramirezdev-uploads/;
    types { image/webp webp; }
    default_type application/octet-stream;
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'none'; sandbox" always;
}

# Panel, API y páginas del newsletter → Node
location = /api/auth/login { limit_req zone=tr_auth burst=5 nodelay; proxy_pass http://tr_panel; include /etc/nginx/snippets/tomasramirezdev-proxy.conf; }
location = /api/public/contact { limit_req zone=tr_auth burst=5 nodelay; proxy_pass http://tr_panel; include /etc/nginx/snippets/tomasramirezdev-proxy.conf; }
location ^~ /api/ { limit_req zone=tr_api burst=40 nodelay; proxy_pass http://tr_panel; include /etc/nginx/snippets/tomasramirezdev-proxy.conf; }
location ^~ /admin { proxy_pass http://tr_panel; include /etc/nginx/snippets/tomasramirezdev-proxy.conf; }
location ^~ /newsletter { proxy_pass http://tr_panel; include /etc/nginx/snippets/tomasramirezdev-proxy.conf; }
location ^~ /nl-assets/ { proxy_pass http://tr_panel; include /etc/nginx/snippets/tomasramirezdev-proxy.conf; }
